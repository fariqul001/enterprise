{% extends 'base.html' %}

{% block title %}Add New Fund{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Add New Fund</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Fund Name</label>
                            {{ form.name }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            {{ form.description }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Minimum Investment</label>
                            {{ form.minimum_investment }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Expected Return</label>
                            {{ form.expected_return }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Duration</label>
                            {{ form.duration }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total Capacity</label>
                            {{ form.total_capacity }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create Fund</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
